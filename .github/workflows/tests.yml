name: Tests

# The whole test suite, on every push and pull request to main. The build workflows run only a handful of packaging
# tests and only on a tag, so until this existed nothing checked a change before it reached main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/audit-cloud-continuation-*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run process and QML lifetime handoff checks
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_cli_culler_process.py tests/test_cli_culler_task.py tests/test_qml_cli_culler.py tests/test_qml_lifetime.py tests/test_qml_launch_selection.py tests/test_qml_raw_preview.py::test_detail_timer_does_not_launch_native_work_for_demo_edits tests/test_qml_raw_retouch.py::test_retouch_drag_stops_at_viewport_and_releases_controls --junitxml=handoff-results.xml

      - name: Run Windows path compatibility checks
        if: ${{ !cancelled() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_runtime_path_aliases.py tests/test_frozen_bootstrap.py tests/test_ai_python_runner.py tests/test_ai_model.py tests/test_ai_runtime_packages.py tests/test_aiculler_workflow.py tests/test_catalog_repository.py tests/test_production_workflows.py tests/test_scanner.py --junitxml=windows-path-results.xml

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_ADDOPTS: --junitxml=test-results.xml
        run: python -m pytest -q -p no:cacheprovider

      - name: Build source wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Upload test reports and source wheel
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: windows-audit-validation-${{ github.sha }}
          path: |
            *-results.xml
            dist/*.whl
          if-no-files-found: error

  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # What Qt needs to start without a display server.
      - name: Install the Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install the app and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider
