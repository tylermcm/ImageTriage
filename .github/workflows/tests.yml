name: Tests

# The whole test suite, on every push and pull request to main. The build workflows run only a handful of packaging
# tests and only on a tag, so until this existed nothing checked a change before it reached main.
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the app and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider

  linux:
    name: Linux (reported, not required)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The suite has known failures on Linux (51 when this workflow was added: tests that build Windows paths or call
    # Windows-only APIs, and some drift; see the "Tests" section of docs/audit_20261111.md). Until those are fixed or
    # marked, this job shows its result without failing the workflow. Remove this line once the Linux run is clean, so
    # that a new Linux failure blocks a change the way a Windows one does.
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # What Qt needs to start without a display server.
      - name: Install the Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      - name: Install the app and the test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider
