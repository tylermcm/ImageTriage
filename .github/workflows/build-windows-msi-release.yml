name: Build And Release Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - 'codex/audit-cloud-continuation-*'
    paths:
      - 'packaging/photocraft_validation_pin.txt'
      - '.github/workflows/build-windows-msi-release.yml'

permissions:
  contents: write

jobs:
  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cx_Freeze pytest
          python -m pip install -e .

      - name: Verify release tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          import tomllib

          tag_version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"Tag v{tag_version} does not match pyproject version {project_version}."
              )

      - name: Run packaging smoke tests
        run: |
          python -m pytest tests/test_qml_only_architecture.py tests/test_freeze_support.py tests/test_version.py tests/test_updater.py -q

      - name: Compile packaging scripts
        run: |
          python -m compileall freeze_support.py setup_msi.py packaging/ai_python_runner.py packaging/ai_runtime_installer.py packaging/image_triage_cleanup.py

      # The installer carries the PhotoCraft editor, so the release builds it from the fork's integration branch at the commit named in
      # packaging/photocraft_pin.txt (bump that file, after validating the new editor, to ship a newer one).
      - name: Read the pinned PhotoCraft commit
        id: pin
        shell: pwsh
        run: |
          $pinFile = 'packaging/photocraft_pin.txt'
          # Audit artifacts pair the repaired candidate without promoting the release pin.
          if ($env:GITHUB_REF -like 'refs/heads/codex/audit-cloud-continuation-*') {
            $pinFile = 'packaging/photocraft_validation_pin.txt'
          }
          $ref = (Get-Content $pinFile -Raw).Trim()
          if ($ref -notmatch '^[0-9a-f]{40}$') { throw "$pinFile must hold a full 40-character commit hash." }
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Check out PhotoCraft
        uses: actions/checkout@v6
        with:
          repository: tylermcm/photocraft
          ref: ${{ steps.pin.outputs.ref }}
          path: photocraft-src

      # The pictures the app shows are only current when they were made by the render algorithm the app expects. A pinned editor
      # with another algorithm would make every saved edit look out of date, so the build stops here instead of shipping it.
      - name: Check the editor's render algorithm matches the app
        shell: python
        run: |
          import re
          from pathlib import Path

          source = Path("photocraft-src/crates/ui-egui/src/render_manifest.rs").read_text(encoding="utf-8")
          editor = re.search(r"pub const ALGORITHM: u64 = (\d+);", source)
          bridge = re.search(r"^RENDER_ALGORITHM = (\d+)$", Path("image_triage/photocraft_bridge.py").read_text(encoding="utf-8"), re.M)
          if editor is None or bridge is None:
              raise SystemExit("Could not read the render algorithm from the editor source or from photocraft_bridge.py.")
          if editor.group(1) != bridge.group(1):
              raise SystemExit(
                  f"The pinned PhotoCraft renders with algorithm {editor.group(1)}; image_triage/photocraft_bridge.py expects "
                  f"{bridge.group(1)}. Bump packaging/photocraft_pin.txt to the validated editor commit."
              )

      - name: Verify native candidate source
        if: startsWith(github.ref, 'refs/heads/codex/audit-cloud-continuation-')
        shell: pwsh
        env:
          PHOTOCRAFT_SOURCE_ROOT: ${{ github.workspace }}/photocraft-src
        run: python -m pytest -q tests/test_full_render.py tests/test_photocraft_mask_capability.py

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache the PhotoCraft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            photocraft-src/target
          key: photocraft-${{ runner.os }}-${{ steps.pin.outputs.ref }}
          restore-keys: photocraft-${{ runner.os }}-

      - name: Validate PhotoCraft release I/O
        # The audit candidate must pass its original small-stack release regression first.
        # These are native tests; do not enlarge the test stack or suppress failures.
        if: startsWith(github.ref, 'refs/heads/codex/audit-cloud-continuation-')
        shell: pwsh
        working-directory: photocraft-src
        env:
          PHOTOCRAFT_NO_PRINT: "1"
          RUST_TEST_THREADS: "2"
        run: |
          cargo test --release --locked -p photocraft-io --lib
          if ($LASTEXITCODE -ne 0) { throw 'PhotoCraft release I/O tests failed' }

      - name: Validate PhotoCraft release algorithms
        if: startsWith(github.ref, 'refs/heads/codex/audit-cloud-continuation-')
        shell: pwsh
        working-directory: photocraft-src
        env:
          PHOTOCRAFT_NO_PRINT: "1"
          RUST_TEST_THREADS: "2"
        run: |
          cargo test --release --locked -p photocraft-algo --lib --test camera_raw_red_eye
          if ($LASTEXITCODE -ne 0) { throw 'PhotoCraft release algorithm tests failed' }

      - name: Build PhotoCraft
        shell: pwsh
        working-directory: photocraft-src
        run: |
          cargo build --release --locked -p photocraft
          if ($LASTEXITCODE -ne 0) { throw 'PhotoCraft build failed' }

      # The RAW preview worker (native/raw_preview) is built against the same PhotoCraft source, into the same target folder so
      # the crates the editor build compiled are reused. Its manifest is made from the template, as scripts/build_raw_preview.ps1 does.
      - name: Build the RAW preview worker
        shell: pwsh
        run: |
          $pc = (Resolve-Path photocraft-src).Path.Replace('\','/')
          $src = (Resolve-Path native/raw_preview).Path.Replace('\','/')
          New-Item -ItemType Directory -Force -Path raw-preview-build | Out-Null
          $manifest = (Get-Content -LiteralPath native/raw_preview/Cargo.toml.in -Raw).Replace('@PHOTOCRAFT@',$pc).Replace('@SOURCE@',$src)
          Set-Content -LiteralPath raw-preview-build/Cargo.toml -Value $manifest -Encoding utf8
          $env:CARGO_TARGET_DIR = "$pc/target"
          cargo build --release --manifest-path raw-preview-build/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'RAW preview worker build failed' }
          $exe = (Resolve-Path photocraft-src/target/release/image-triage-raw-preview.exe).Path
          "IMAGE_TRIAGE_BUNDLE_RAW_PREVIEW_EXE=$exe" >> $env:GITHUB_ENV
          Write-Host "Bundling $exe"

      - name: Point the installer at the editor
        shell: pwsh
        run: |
          $exe = (Resolve-Path photocraft-src/target/release/photocraft.exe).Path
          "IMAGE_TRIAGE_BUNDLE_PHOTOCRAFT_EXE=$exe" >> $env:GITHUB_ENV
          Write-Host "Bundling $exe from PhotoCraft ${{ steps.pin.outputs.ref }}"

      - name: Build MSI
        run: python setup_msi.py bdist_msi

      - name: Smoke test frozen QML startup
        if: startsWith(github.ref, 'refs/heads/codex/audit-cloud-continuation-')
        shell: python
        env:
          QT_QPA_PLATFORM: offscreen
          PHOTOCRAFT_VALIDATION_REF: ${{ steps.pin.outputs.ref }}
        run: |
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          from PIL import Image

          root = Path('build/audit-smoke').resolve()
          fixtures = root / 'photos'
          fixtures.mkdir(parents=True, exist_ok=True)
          for number, color in enumerate(('teal', 'coral', 'gold'), 1):
              Image.new('RGB', (160, 120), color).save(fixtures / f'frame-{number}.jpg')
          app, = Path('build').glob('exe.*/ImageTriage.exe')
          app = app.resolve()
          assert (app.parent / 'photocraft/photocraft.exe').is_file()
          assert (app.parent / 'image-triage-raw-preview.exe').is_file()
          capture = root / 'startup.png'
          env = dict(os.environ, LOCALAPPDATA=str(root / 'profile/local'), APPDATA=str(root / 'profile/roaming'),
                     IMAGE_TRIAGE_LOG_DIR=str(root / 'profile/logs'))
          for name in ('LOCALAPPDATA', 'APPDATA', 'IMAGE_TRIAGE_LOG_DIR'):
              Path(env[name]).mkdir(parents=True, exist_ok=True)
          result = subprocess.run([str(app), '--folder', str(fixtures), '--size', '1200x800', '--grab', str(capture), '--grab-wait', '2'],
                                  cwd=root, env=env, capture_output=True, text=True, timeout=60)
          (root / 'startup.log').write_text(result.stdout + result.stderr, encoding='utf-8')
          if result.returncode:
              raise RuntimeError(f'Frozen QML startup failed ({result.returncode}): {result.stderr}')
          with Image.open(capture) as screenshot:
              assert screenshot.width >= 800 and screenshot.height >= 600
          files = [app, app.parent / 'photocraft/photocraft.exe', app.parent / 'image-triage-raw-preview.exe',
                   *Path('dist').resolve().glob('*.msi')]
          manifest = {
              'kind': 'Windows audit validation candidate; not promoted',
              'host_commit': os.environ['GITHUB_SHA'],
              'photocraft_commit': os.environ['PHOTOCRAFT_VALIDATION_REF'],
              'render_algorithm': 3,
              'checks': ['native release I/O suite', 'native release algorithm suite', 'native Red Eye regressions',
                         'host schema', 'frozen QML startup'],
              'remaining': ['live hosted lifecycle acceptance', 'managed models and Store Python acceptance',
                            'complete hosted editor acceptance'],
              'sha256': {},
          }
          for path in files:
              with path.open('rb') as handle:
                  manifest['sha256'][path.name] = hashlib.file_digest(handle, 'sha256').hexdigest()
          (root / 'build-manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(f'Frozen QML startup and bundled native files passed: {app.name}')

      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-triage-msi-${{ startsWith(github.ref, 'refs/tags/') && 'release' || 'validation' }}-${{ github.sha }}
          path: |
            dist/*.msi
            build/audit-smoke/startup.png
            build/audit-smoke/startup.log
            build/audit-smoke/build-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSI to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --title "Image Triage $env:GITHUB_REF_NAME" `
              --notes "Automated release for $env:GITHUB_REF_NAME. Bundled PhotoCraft editor: tylermcm/photocraft@${{ steps.pin.outputs.ref }}"
          }
          gh release upload $env:GITHUB_REF_NAME dist/*.msi --clobber
