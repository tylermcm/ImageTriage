name: Build And Release Windows MSI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows-msi:
    name: Build Windows MSI
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install cx_Freeze pytest
          python -m pip install -e .

      - name: Verify release tag matches pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          import tomllib

          tag_version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as handle:
              project_version = tomllib.load(handle)["project"]["version"]
          if tag_version != project_version:
              raise SystemExit(
                  f"Tag v{tag_version} does not match pyproject version {project_version}."
              )

      - name: Run packaging smoke tests
        run: |
          python -m pytest tests/test_freeze_support.py tests/test_version.py tests/test_updater.py -q

      - name: Compile packaging scripts
        run: |
          python -m compileall freeze_support.py setup_msi.py packaging/ai_python_runner.py packaging/ai_runtime_installer.py packaging/image_triage_cleanup.py

      # The installer carries the PhotoCraft editor, so the release builds it from the fork's integration branch at the commit named in
      # packaging/photocraft_pin.txt (bump that file, after validating the new editor, to ship a newer one).
      - name: Read the pinned PhotoCraft commit
        id: pin
        shell: pwsh
        run: |
          $ref = (Get-Content packaging/photocraft_pin.txt -Raw).Trim()
          if ($ref -notmatch '^[0-9a-f]{40}$') { throw "packaging/photocraft_pin.txt must hold a full 40-character commit hash." }
          "ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Check out PhotoCraft
        uses: actions/checkout@v6
        with:
          repository: tylermcm/photocraft
          ref: ${{ steps.pin.outputs.ref }}
          path: photocraft-src

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Cache the PhotoCraft build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            photocraft-src/target
          key: photocraft-${{ runner.os }}-${{ steps.pin.outputs.ref }}
          restore-keys: photocraft-${{ runner.os }}-

      - name: Build PhotoCraft
        shell: pwsh
        working-directory: photocraft-src
        run: cargo build --release -p photocraft

      - name: Point the installer at the editor
        shell: pwsh
        run: |
          $exe = (Resolve-Path photocraft-src/target/release/photocraft.exe).Path
          "IMAGE_TRIAGE_BUNDLE_PHOTOCRAFT_EXE=$exe" >> $env:GITHUB_ENV
          Write-Host "Bundling $exe from PhotoCraft ${{ steps.pin.outputs.ref }}"

      - name: Build MSI
        run: python setup_msi.py bdist_msi

      - name: List build output
        shell: pwsh
        run: Get-ChildItem dist

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: image-triage-msi-${{ github.sha }}
          path: dist/*.msi
          if-no-files-found: error
          retention-days: 14

      - name: Upload MSI to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --title "Image Triage $env:GITHUB_REF_NAME" `
              --notes "Automated release for $env:GITHUB_REF_NAME. Bundled PhotoCraft editor: tylermcm/photocraft@${{ steps.pin.outputs.ref }}"
          }
          gh release upload $env:GITHUB_REF_NAME dist/*.msi --clobber
