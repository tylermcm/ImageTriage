[project]
name = "image-triage"
version = "2.4.0"
description = "Image Triage"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.1",
    "exifread>=3.0",
    "numpy>=1.26",
    "onnxruntime>=1.16",
    "Pillow>=10.4",
    "PySide6>=6.12",
    "py7zr>=1.1",
    "pillow-heif>=0.18",
    "psd-tools>=1.10",
    "rawpy>=0.20",
    "tokenizers>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
image-triage = "image_triage.main:main"
photoedit = "image_triage.photo_terminal.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["image_triage*", "aiculler*"]

[tool.setuptools.package-data]
aiculler = ["resources/*.csv"]
"image_triage" = ["assets/*.png", "assets/*.ico"]
# The native PocketDrop module, loaded by name from this folder (pocketdrop/_bridge.py).
"image_triage.pocketdrop" = ["pocketdrop.dll", "libpocketdrop.so", "libpocketdrop.dylib"]
"image_triage.qml_shell" = ["qml/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [
    ".git",
    ".msi_build_venv",
    ".pytest_cache",
    "__pycache__",
    "build",
    "build_assets",
    "dist",
    "vendor",
]
