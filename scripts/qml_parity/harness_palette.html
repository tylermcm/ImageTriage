<!doctype html><html><head><meta charset="utf-8"><title>ref</title></head><body style="margin:0;background:#0e0f11"><div id="root"></div>
<script>
class DCLogic{ setState(p){ this.state=Object.assign({},this.state,p); window.__render(); } }
(async()=>{
 const txt=await (await fetch('palette.dc.html')).text();
 const doc=new DOMParser().parseFromString(txt,'text/html');
 const dc=doc.querySelector('x-dc'); const helm=dc.querySelector('helmet');
 for(const n of [...helm.children]) document.head.appendChild(n.cloneNode(true)); helm.remove();
 const code=doc.querySelector('script[data-dc-script]').textContent;
 const Comp=new Function('DCLogic',code+';return Component;')(DCLogic);
 const inst=new Comp(); inst.props={topAlign:'current',palPos:new URLSearchParams(location.search).get('pos')||'float'};
 const q=new URLSearchParams(location.search);
 if(q.get('light'))inst.state.light=true;
 if(q.get('tab')!==null&&q.get('tab')!=='')inst.state.tab=q.get('tab');
 if(q.get('insp')==='0')inst.state.insp=false;
 if(q.get('pal')){inst.state.pal=true;inst.state.palQ=q.get('q')||'';inst.state.palI=+(q.get('pi')||0);inst.state.palCtx=q.get('ctx')||'main';}
 let handlers=[];
 const get=(o,p)=>{p=p.trim(); if(p==='true')return true; if(p==='false')return false; return p.split('.').reduce((a,k)=>a==null?a:a[k],o);};
 const sub=(str,scope)=>str.replace(/\{\{([^}]+)\}\}/g,(m,p)=>{const v=get(scope,p); if(typeof v==='function'){handlers.push(v);return 'h'+(handlers.length-1);} return v==null?'':String(v);});
 function expand(node,scope,out){
   if(node.nodeType===3){out.appendChild(document.createTextNode(sub(node.textContent,scope)));return;}
   if(node.nodeType!==1)return;
   const tag=node.tagName.toLowerCase();
   if(tag==='sc-for'){const arr=get(scope,node.getAttribute('list').replace(/[{}]/g,''))||[];const as=node.getAttribute('as');
     arr.forEach((it,i)=>{const sc=Object.assign({},scope,{[as]:it,$index:i});[...node.childNodes].forEach(c=>expand(c,sc,out));});return;}
   if(tag==='sc-if'){const v=get(scope,node.getAttribute('value').replace(/[{}]/g,''));if(v)[...node.childNodes].forEach(c=>expand(c,scope,out));return;}
   const el=node.namespaceURI?document.createElementNS(node.namespaceURI,node.localName):document.createElement(tag);
   for(const a of node.attributes){ if(a.name.startsWith('hint-'))continue; {let val=sub(a.value,scope); if(a.name==='src'){const ids=['456514c110c5ecfd8f6162c5571d0ae8','12511675f0bab8e4aa91d394d4edead8','c4c6df0cfc8df51c2b9b7b56a434ef76','190737aa754c4ac6dcff1e5857ccf647','469a2c62aa7ea93f1de77fe61e58c7a4','357ecab7d7a889a6e83d14050e64d643','a138582bf85cf6b62fde2a41cb49e44b','512d14a16b37a9bfc8ff6285ab66ce4b','754773b1fae95c70abca0987bc69695a','a0ee21ab9d1f33226c9b9de08a9ab048','2451a9dbcc4a96693a7466d0a145c716','5ba1333c25c871f57178cb16e548e784'];const m=/_blob\/([0-9a-f]+)/.exec(val);if(m)val='img/p'+String(ids.indexOf(m[1])+1).padStart(2,'0')+'.jpg';} el.setAttribute(a.name,val);} }
   [...node.childNodes].forEach(c=>expand(c,scope,el)); out.appendChild(el);
 }
 const tpl=dc;
 window.__render=()=>{
  handlers=[]; const vals=inst.renderVals(); const root=document.getElementById('root'); root.innerHTML='';
  [...tpl.childNodes].forEach(c=>expand(c,vals,root));
  root.querySelectorAll('*').forEach(el=>{for(const a of [...el.attributes]){const m=/^on(click|input|keydown)$/i.exec(a.name);
    if(m&&/^h\d+$/.test(a.value)){const f=handlers[+a.value.slice(1)];el.removeAttribute(a.name);el.addEventListener(m[1].toLowerCase(),e=>f(e));}}});
  document.title='ready'; if(window.__inst.componentDidMount&&!window.__m){window.__m=1;window.__inst.componentDidMount();}
 };
 window.__inst=inst; window.__render();
})();
</script></body></html>
