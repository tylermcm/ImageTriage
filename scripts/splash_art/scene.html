function rnd(seed){let s=seed;return()=>{s=(s*1664525+1013904223)%4294967296;return s/4294967296}}
// homography: unit rect (0,0,w,h) -> quad TL,TR,BR,BL
function hom(w,h,q){
  const src=[[0,0],[w,0],[w,h],[0,h]], A=[], B=[];
  for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=q[i];
    A.push([x,y,1,0,0,0,-u*x,-u*y]);B.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);B.push(v)}
  const n=8;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[B[i],B[m]]=[B[m],B[i]];
    for(let r=0;r<n;r++)if(r!==i){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];B[r]-=f*B[i]}}
  const [a,b,c,d,e,f,g,hh]=B.map((v,i)=>v/A[i][i]);
  return `matrix3d(${a},${d},0,${g},${b},${e},0,${hh},0,0,1,0,${c},${f},0,1)`;
}
function quadFrame(parent,img,w,h,q,cls,style=''){
  const d=document.createElement('div');d.className='fr '+cls;d.style.cssText=`width:${w}px;height:${h}px;transform:${hom(w,h,q)};${style}`;
  const i=document.createElement('img');i.src=img;d.appendChild(i);parent.appendChild(d);return d}

  lfr.push([x,y,w,h,Math.floor(lr()*4),d]);

 d.style.cssText=`left:${x-100}px;width:200px;text-align:center;top:735px;color:#e4e7fa;font-weight:500;font-size:17px;letter-spacing:.2em;line-height:1;padding-left:.2em`;$('c').appendChild(d)});

 function fit(id,target){const el=$(id);el.style.letterSpacing='0';el.style.display='inline-block';el.style.width='auto';
   const n=el.textContent.length;let w=el.getBoundingClientRect().width;el.style.letterSpacing=((target-w)/(n-1))+'px';el.style.paddingLeft='0';
