<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Set Up AI – mockup</title>
<style>
  :root{--bg:#13151c;--surface:#1a1d27;--line:#2a2e3d;--text:#eceef5;--muted:#8d92a6;--accent:#6a70f5;--ok:#5fd4a0}
  *{box-sizing:border-box;margin:0}
  body{background:#08090c;color:var(--text);font:14px/1.45 "Segoe UI",system-ui,sans-serif;
    min-height:100vh;display:grid;place-items:center;padding:24px}
  .win{width:min(520px,100%);background:var(--bg);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
  header{padding:24px 28px 8px}
  h1{font-size:20px;font-weight:600}
  header p{color:var(--muted);margin-top:2px}
  .body{padding:12px 28px 20px;display:grid;gap:10px}
  .opt{display:grid;grid-template-columns:20px 1fr auto;gap:14px;align-items:center;text-align:left;
    background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;
    color:var(--text);font:inherit;cursor:pointer;transition:border-color .15s,background .15s}
  .opt:hover{border-color:#3d4358}
  .dot{width:18px;height:18px;border-radius:50%;border:2px solid #4a5068;display:grid;place-items:center}
  .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);transform:scale(0);transition:.15s}
  .opt.on{border-color:var(--accent);background:rgba(106,112,245,.09)}
  .opt.on .dot{border-color:var(--accent)}
  .opt.on .dot::after{transform:scale(1)}
  .name{font-weight:600;display:flex;gap:8px;align-items:center}
  .tag{font-size:11px;font-weight:600;color:var(--ok);background:rgba(95,212,160,.12);
    padding:2px 8px;border-radius:99px}
  .desc{color:var(--muted);font-size:13px}
  .sz{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
  .inc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px;color:var(--muted);font-size:12px}
  .chip{border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--text);font-size:12px}
  footer{display:flex;align-items:center;gap:10px;padding:16px 28px;background:var(--surface);
    border-top:1px solid var(--line)}
  .total{flex:1}
  .total b{font-size:16px}
  .total span{display:block;color:var(--muted);font-size:12px}
  .btn{font:inherit;border-radius:8px;padding:9px 22px;cursor:pointer;border:1px solid var(--line);
    background:transparent;color:var(--text)}
  .btn:hover{background:#232736}
  .btn.p{background:var(--accent);border-color:var(--accent);font-weight:600;color:#fff}
  .btn.p:hover{filter:brightness(1.12)}
</style>
</head>
<body>
<div class="win">
  <header>
    <h1>Set up AI</h1>
    <p>Choose how it runs on this computer.</p>
  </header>

  <div class="body" id="pick">
    <button class="opt on" data-v="gpu">
      <i class="dot"></i>
      <div><div class="name">GPU <span class="tag">Recommended</span></div><div class="desc">NVIDIA graphics card</div></div>
      <span class="sz">6.4 GB</span>
    </button>
    <button class="opt" data-v="cpu">
      <i class="dot"></i>
      <div><div class="name">CPU</div><div class="desc">Any computer</div></div>
      <span class="sz">2.5 GB</span>
    </button>
    <div class="inc">Also installs <span class="chip">Culling</span><span class="chip">Masking</span><span class="chip">Faces</span></div>
  </div>

  <footer>
    <div class="total"><b id="dl">7.0 GB download</b><span id="disk">9.7 GB on disk</span></div>
    <button class="btn">Later</button>
    <button class="btn p">Install</button>
  </footer>
</div>
<script>
  const D={gpu:['7.0','9.7'],cpu:['3.1','4.8']};
  pick.addEventListener('click',e=>{
    const b=e.target.closest('.opt'); if(!b) return;
    pick.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));
    const [d,k]=D[b.dataset.v];
    dl.textContent=d+' GB download'; disk.textContent=k+' GB on disk';
  });
</script>
</body>
</html>
