<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Set up AI mockup</title>
<style>
:root{
  --bg:#f3f4f7;--panel:#ffffff;--panel2:#f8f9fb;--line:#dde1e8;--ink:#171a21;--mut:#667085;--soft:#8a93a3;
  --a1:#ff9a5a;--a2:#ff5e8a;--a3:#b25cff;--a4:#5a8cff;--ok:#1f9d63;--warn:#c27c0e;--chip:#eef0f5;
  --grad:linear-gradient(100deg,var(--a1),var(--a2) 35%,var(--a3) 68%,var(--a4));
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#14161b;--panel:#1c1f26;--panel2:#20242c;--line:#2d323c;--ink:#eceef3;--mut:#9aa3b2;--soft:#788193;--chip:#262b34;--ok:#3ecf8e;--warn:#e0a13a}}
:root[data-theme=dark]{--bg:#14161b;--panel:#1c1f26;--panel2:#20242c;--line:#2d323c;--ink:#eceef3;--mut:#9aa3b2;--soft:#788193;--chip:#262b34;--ok:#3ecf8e;--warn:#e0a13a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:19px;margin:0 0 4px}p{margin:0;color:var(--mut)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 18px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--ink);color:var(--bg)}
.note{font-size:12.5px;color:var(--soft)}
.dlg{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 50px rgba(20,25,40,.14);overflow:hidden;height:365px;display:flex;flex-direction:column}
.dlg>div[id^=view]{flex:1;min-height:0;flex-direction:column}
.dlg>div[id^=view]:not(.hidden){display:flex}
.aurora{height:3px;background:var(--grad)}
.head{padding:22px 26px 6px}.head h3{margin:0;font-size:22px}.head p{margin-top:4px}
.grid{display:grid;grid-template-columns:1fr 250px;grid-template-rows:minmax(0,1fr);flex:1;min-height:0}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.list{padding:14px 26px 24px;display:grid;gap:10px;align-content:start;grid-auto-rows:max-content;overflow-y:auto;min-height:0}
.card{border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden}
.top{display:grid;grid-template-columns:44px 1fr auto 30px;gap:14px;align-items:center;padding:14px 16px}
.top.core{grid-template-columns:44px 1fr auto}
.top h5{margin:0;font-size:16px;font-weight:650}.top .one{font-size:13px;color:var(--mut);margin-top:1px}
.size{text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.size small{display:block;font-size:11.5px;font-weight:400;color:var(--soft)}
.sw{position:relative;width:44px;height:26px;display:block}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:2}
.sw i{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:.15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.15s}
.sw input:checked+i{background:var(--grad)}
.sw input:checked+i::after{left:21px}
.sw input:focus-visible+i{outline:2px solid var(--a4);outline-offset:2px}
.tick{width:26px;height:26px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:14px;margin-left:9px}
.chev{border:1px solid var(--line);background:var(--panel2);border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--ink);font-size:13px}
.more{border-top:1px solid var(--line);background:var(--panel2);padding:6px 16px}
.kid{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.kid:last-child{border-bottom:0}
.kid input{width:17px;height:17px;accent-color:var(--a3)}
.kid span:nth-child(2){flex:1}.kid b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--mut)}
.warn{margin:0 16px 14px;padding:10px 12px;border-radius:10px;background:rgba(194,124,14,.10);color:var(--warn);font-size:13px}
.side{border-left:1px solid var(--line);background:var(--panel2);padding:22px;display:flex;flex-direction:column;gap:12px;justify-content:center;position:relative}
@media (max-width:760px){.side{border-left:0;border-top:1px solid var(--line)}}
.big{font-size:34px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.btn{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:650;cursor:pointer;color:#fff;background:var(--grad);width:100%}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line);font-weight:550}
.morebtn{border:0;background:transparent;color:var(--mut);font:inherit;font-size:13px;cursor:pointer;padding:6px 2px;text-align:left;width:max-content}
.morebtn:hover{color:var(--ink)}
.menu{position:absolute;left:14px;right:14px;bottom:56px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 34px rgba(20,25,40,.22);padding:6px;z-index:5}
.menu button{display:block;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);font:inherit;padding:9px 10px;border-radius:8px;cursor:pointer}
.menu button:hover{background:var(--panel2)}
.menu .note{padding:6px 10px 8px;border-top:1px solid var(--line);margin-top:4px}
.hidden{display:none!important}
.steps{padding:6px 26px 18px}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center;font-size:15px}
.step:last-child{border-bottom:0}
.ico{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--soft)}
.step.done .ico{background:var(--ok);border-color:var(--ok);color:#fff}
.step.run .ico{border-color:transparent;background:conic-gradient(var(--a1),var(--a2),var(--a3),var(--a4),var(--a1));animation:spin 1.1s linear infinite;color:transparent}
.step.todo{color:var(--soft)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.step.run .ico{animation:none}}
.pb{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 26px 8px}.pb i{display:block;height:100%;width:0;background:var(--grad);transition:width .25s}
.foot{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:14px 26px;border-top:1px solid var(--line)}
.ready{padding:30px 26px 10px;text-align:center}.ready .tick{width:54px;height:54px;font-size:28px;margin:0 auto 12px}
.ready h3{margin:0;font-size:22px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Set up AI</h1>
  <p>Mockup, not the real app. Switch the PC type to see the defaults change, then press Install.</p>
  <div class="bar">
    <div class="seg" id="hw"><button data-v="cpu" class="on">Laptop, no GPU</button><button data-v="gpu">Desktop with NVIDIA GPU</button><button data-v="done">Already set up</button></div>
    <span style="flex:1"></span>
    <div class="seg" id="theme"><button data-v="auto" class="on">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div>
  </div>

  <div class="dlg">
    <div class="aurora"></div>
    <div id="viewSelect">
      <div class="head"><h3>Set up AI</h3><p id="lede"></p></div>
      <div class="grid">
        <div class="list" id="list"></div>
        <aside class="side">
          <div><div class="note">Download</div><div class="big" id="total">0</div><div class="note" id="eta"></div></div>
          <button class="btn" id="install">Install</button>
          <button class="btn sec" id="later">Not now</button>
          <button class="morebtn" id="moreBtn" aria-haspopup="menu" aria-expanded="false">More &#9662;</button>
          <div class="menu hidden" id="menu" role="menu">
            <button role="menuitem">Check installation</button>
            <button role="menuitem">Repair</button>
            <button role="menuitem">Remove everything</button>
            <div class="note" id="more"></div>
          </div>
        </aside>
      </div>
    </div>

    <div id="viewProgress" class="hidden">
      <div class="head"><h3 id="pTitle">Installing AI</h3><p>You can keep using Image Triage. Setup continues in the background.</p></div>
      <div class="pb"><i id="bar"></i></div>
      <div class="steps" id="steps"></div>
      <div class="foot"><span class="note" id="pEta"></span><button class="btn sec" style="width:auto" id="cancel">Cancel</button></div>
    </div>

    <div id="viewDone" class="hidden">
      <div class="ready"><div class="tick">&#10003;</div><h3>AI is ready</h3><p id="doneNote" style="margin-top:6px"></p></div>
      <div class="foot" style="justify-content:flex-end"><button class="btn" style="width:auto;padding:10px 26px" id="close">Done</button></div>
    </div>
  </div>
</div>

<script>
const fmt=mb=>mb>=1000?(mb/1000).toFixed(1)+" GB":Math.round(mb)+" MB";
// Download megabytes from the app's manifest and the measured runtime sizes. PyTorch is part of the AI engine, never listed.
const CORE={cpu:{engine:350+2600},gpu:{engine:6600}}, CORE_EXTRA=170+98; // faces, search
const KIDS={
  cull:[["maniqa","Quality",543],["qreal","Appeal",2130]],
  edit:[["birefnet","Subject masks",425],["sam","Click select",150],["depth","Depth",100],["oneformer","Scene regions",196]]
};
const PILLS={
  cull:{name:"Culling",one:"Picks the best photo in each group"},
  edit:{name:"Editor tools",one:"Smart masks and selections in the editor"}
};
const SC={
  cpu:{pc:"laptop",gpu:false,lede:"One download, and you can add more later.",have:false},
  gpu:{pc:"desktop",gpu:true,lede:"One download. Your graphics card makes it fast.",have:false},
  done:{pc:"desktop",gpu:true,lede:"AI is set up. Change what is installed here.",have:true}
};
let scen="cpu",sel=new Set(),open={cull:false,edit:false},timer=null,touched={cull:false};
const $=id=>document.getElementById(id);
const kids=g=>KIDS[g].map(k=>k[0]);
const total=g=>KIDS[g].reduce((a,k)=>a+k[2],0);
const coreMb=()=>(SC[scen].gpu?CORE.gpu:CORE.cpu).engine+CORE_EXTRA;
function reset(){
  const s=SC[scen];sel=new Set();touched={cull:false};
  if(s.gpu||s.have){Object.values(KIDS).flat().forEach(k=>sel.add(k[0]))}   // GPU: both on. CPU: both off.
  render();show("viewSelect");
}
function show(v){["viewSelect","viewProgress","viewDone"].forEach(x=>$(x).classList.toggle("hidden",x!==v))}
function mbOf(key){return Object.values(KIDS).flat().find(k=>k[0]===key)[2]}
function render(){
  const s=SC[scen];$("lede").textContent=s.lede;
  let h=`<div class="card"><div class="top core"><span class="tick" style="margin:0">&#10003;</span><div><h5>Core</h5><div class="one">The AI engine, search, and faces and People</div></div><div class="size">${s.have?"&mdash;":fmt(coreMb())}<small>${s.have?"installed":"always included"}</small></div></div></div>`;
  for(const g of Object.keys(PILLS)){
    const p=PILLS[g],ks=kids(g),n=ks.filter(k=>sel.has(k)).length,all=n===ks.length,tot=total(g),chosen=ks.filter(k=>sel.has(k)).reduce((a,k)=>a+mbOf(k),0);
    h+=`<div class="card"><div class="top"><label class="sw"><input type="checkbox" data-g="${g}" ${n>0?"checked":""} aria-label="${p.name}"><i></i></label>
      <div><h5>${p.name}</h5><div class="one">${p.one}${n>0&&!all?` &middot; ${n} of ${ks.length} models`:""}</div></div>
      <div class="size">${fmt(n>0&&!all?chosen:tot)}<small>${s.have&&n>0?"installed":"download"}</small></div>
      <button class="chev" data-p="${g}" aria-expanded="${open[g]}" title="Choose models">${open[g]?"&#9652;":"&#9662;"}</button></div>`;
    if(g==="cull"&&!s.gpu&&touched.cull&&(sel.has("maniqa")||sel.has("qreal")))h+=`<div class="warn">This PC has no graphics card, so Culling is slow here: about half a minute or more per photo. A large folder can take hours.</div>`;
    if(open[g])h+=`<div class="more">${KIDS[g].map(k=>`<label class="kid"><input type="checkbox" data-k="${k[0]}" ${sel.has(k[0])?"checked":""}><span>${k[1]}</span><b>${fmt(k[2])}</b></label>`).join("")}</div>`;
    h+="</div>";
  }
  $("list").innerHTML=h;
  $("list").querySelectorAll("input[data-g]").forEach(i=>i.onchange=()=>{const g=i.dataset.g;kids(g).forEach(k=>i.checked?sel.add(k):sel.delete(k));if(g==="cull")touched.cull=true;render()});
  $("list").querySelectorAll("input[data-k]").forEach(i=>i.onchange=()=>{i.checked?sel.add(i.dataset.k):sel.delete(i.dataset.k);if(["maniqa","qreal"].includes(i.dataset.k))touched.cull=true;render()});
  $("list").querySelectorAll(".chev").forEach(b=>b.onclick=()=>{open[b.dataset.p]=!open[b.dataset.p];if(b.dataset.p==="cull")touched.cull=true;render()});
  const have=new Set(s.have?Object.values(KIDS).flat().map(k=>k[0]):[]);
  const add=[...sel].filter(k=>!have.has(k)),rem=[...have].filter(k=>!sel.has(k));
  const dl=(s.have?0:coreMb())+add.reduce((a,k)=>a+mbOf(k),0);
  $("total").textContent=dl?fmt(dl):(rem.length?"Nothing to download":"Up to date");
  $("eta").textContent=dl?"about "+Math.max(1,Math.round(dl/60/12))+" min":"";
  $("install").textContent=dl?"Install":rem.length?"Remove "+rem.length+(rem.length>1?" models":" model"):"Check installation";
  $("more").textContent=s.have?"Installed: "+fmt(coreMb()+[...have].reduce((a,k)=>a+mbOf(k),0))+". Free on this drive: 212 GB.":"Needs "+fmt((dl)*1.3)+" of disk space. Free on this drive: 212 GB.";
}
$("hw").onclick=e=>{const b=e.target.closest("button");if(!b)return;scen=b.dataset.v;[...$("hw").children].forEach(x=>x.classList.toggle("on",x===b));clearInterval(timer);open={cull:false,edit:false};reset()};
$("theme").onclick=e=>{const b=e.target.closest("button");if(!b)return;[...$("theme").children].forEach(x=>x.classList.toggle("on",x===b));b.dataset.v==="auto"?document.documentElement.removeAttribute("data-theme"):document.documentElement.setAttribute("data-theme",b.dataset.v)};
$("later").onclick=()=>reset();
const closeMenu=()=>{$("menu").classList.add("hidden");$("moreBtn").setAttribute("aria-expanded","false")};
$("moreBtn").onclick=e=>{e.stopPropagation();const h=$("menu").classList.toggle("hidden");$("moreBtn").setAttribute("aria-expanded",String(!h))};
document.addEventListener("click",e=>{if(!e.target.closest("#menu"))closeMenu()});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeMenu()});
$("install").onclick=()=>{
  if($("install").textContent==="Check installation"||$("install").textContent.startsWith("Remove")){finish();return}
  const steps=["Downloading","Installing","Checking that it works"];
  show("viewProgress");let i=0,p=0;
  const draw=()=>{
    $("steps").innerHTML=steps.map((n,j)=>`<div class="step ${j<i?"done":j===i?"run":"todo"}"><div class="ico">${j<i?"&#10003;":j+1}</div><div>${n}</div></div>`).join("");
    const pct=Math.min(100,Math.round(100*(i+Math.min(p,100)/100)/steps.length));$("bar").style.width=pct+"%";
    $("pEta").textContent=pct<100?"about "+Math.max(1,Math.round((100-pct)/12))+" min left":"";
  };
  draw();clearInterval(timer);
  timer=setInterval(()=>{p+=9+Math.random()*9;if(p>=100){p=0;i++;if(i>=steps.length){clearInterval(timer);finish();return}}draw()},260);
};
$("cancel").onclick=()=>{clearInterval(timer);reset()};
function finish(){show("viewDone");$("doneNote").textContent=scen==="cpu"&&sel.size===0?"Culling and Editor tools can be added any time from the AI chip.":"Open this page any time from the AI chip."}
$("close").onclick=()=>reset();
reset();
</script>
</body>
</html>
